name: pr-summary

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  summary:
    if: >-
      github.event.issue.pull_request && contains(github.event.comment.body, '<!-- visual-verify ')
      && (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      || github.event.comment.user.login == 'claude[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: pr-summary-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number }}
    steps:
      - name: Find the PR's head
        id: pr
        run: |
          gh api "repos/$GH_REPO/pulls/$PR" --jq '"repo=\(.head.repo.full_name)", "sha=\(.head.sha)"' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.repo == github.repository
        with:
          ref: ${{ steps.pr.outputs.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Write the summary comment
        if: steps.pr.outputs.repo == github.repository
        run: python3 .github/scripts/pr-summary.py
