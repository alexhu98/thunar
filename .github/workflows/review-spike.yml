name: review-spike

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  spike:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Review at low
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Use the Skill tool to run the code-review skill with args "low origin/main...HEAD". Report every finding it
            reports, in the output schema.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Skill,ReportFindings,Read,Grep,Glob,Agent,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --json-schema '{"type":"object","properties":{"findings":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"line":{"type":"integer"},"severity":{"type":"string"},"summary":{"type":"string"},"failure_scenario":{"type":"string"},"verdict":{"type":"string"}},"required":["file","summary","failure_scenario"]}}},"required":["findings"]}'

      - name: Show results
        if: always()
        env:
          REVIEW: ${{ steps.review.outputs.structured_output }}
          REVIEW_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          printf '## Review\n```json\n%s\n```\n' "$REVIEW" >> "$GITHUB_STEP_SUMMARY"
          for f in "$REVIEW_FILE"; do
            [ -f "$f" ] && jq -c '.[] | select(.type == "result") | {subtype, num_turns, duration_ms, is_error}' "$f" || true
            [ -f "$f" ] && jq -c '.[] | select(.type == "assistant") | .message.content[] | select(.type == "tool_use") | {name, input}' "$f" | cut -c1-400 || true
          done
