name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'push' && format('release-{0}', github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      actions: write
      contents: read
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.changes.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false

      - name: Check what the PR changes
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          code=$(grep -Ev '^(explainers/|\.claude/)|\.md$|\.narration\.json$' "$RUNNER_TEMP/changed.txt" || true)
          if [[ -s $RUNNER_TEMP/changed.txt && -z $code ]]; then
            echo skip=true >> "$GITHUB_OUTPUT"
            echo "Build and verify skipped: the PR changes only explainers/, .claude/, *.md or narration files." >> "$GITHUB_STEP_SUMMARY"
          else
            echo skip=false >> "$GITHUB_OUTPUT"
          fi
          sed 's/^/  /' "$RUNNER_TEMP/changed.txt"

      - name: Add Zorin OS PPA (Xfce 4.20 libraries)
        if: steps.changes.outputs.skip != 'true'
        run: sudo add-apt-repository -y ppa:zorinos/stable

      - name: Install build dependencies
        if: steps.changes.outputs.skip != 'true'
        run: |
          sudo apt-get build-dep -y ./
          sudo apt-get install -y --no-install-recommends ccache

      - name: Dry-run the publish scripts
        if: github.event_name == 'pull_request' && steps.changes.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export VERSION DRY_RUN=1
          VERSION=$(.github/scripts/next-version.sh)
          echo "Version: $VERSION"
          .github/scripts/publish-release.sh
          .github/scripts/prune-releases.sh

      - name: Stamp version
        id: version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(.github/scripts/next-version.sh)
          {
            echo "thunar ($version) noble; urgency=medium"
            echo
            echo "  * CI build of ${GITHUB_SHA::12}."
            echo
            echo " -- GitHub Actions <actions@github.com>  $(date -R)"
            echo
            cat debian/changelog
          } > debian/changelog.new
          mv debian/changelog.new debian/changelog
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Pick the ccache key
        id: ccache
        if: steps.changes.outputs.skip != 'true'
        run: echo "key=ccache-$ImageOS-$ImageVersion-" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: ccache-restore
        if: steps.changes.outputs.skip != 'true'
        with:
          path: ~/.ccache
          key: ${{ steps.ccache.outputs.key }}${{ github.run_id }}
          restore-keys: ${{ steps.ccache.outputs.key }}

      - name: Build
        if: steps.changes.outputs.skip != 'true'
        run: |
          export PATH=/usr/lib/ccache:$PATH CCACHE_DIR=$HOME/.ccache CCACHE_BASEDIR=$GITHUB_WORKSPACE CCACHE_MAXSIZE=500M
          ccache -z
          dpkg-buildpackage -b -us -uc -j"$(nproc)"
          ccache -s
          mkdir dist
          mv ../*.deb dist/
          ls -l dist

      - uses: actions/cache/save@v4
        if: steps.changes.outputs.skip != 'true'
        with:
          path: ~/.ccache
          key: ${{ steps.ccache.outputs.key }}${{ github.run_id }}

      - name: Drop this branch's previous ccache
        if: steps.changes.outputs.skip != 'true' && steps.ccache-restore.outputs.cache-matched-key != '' && steps.ccache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.ccache-restore.outputs.cache-matched-key }}
        run: gh api -X DELETE "repos/$GH_REPO/actions/caches?key=$OLD&ref=$GITHUB_REF" || echo "kept $OLD, which belongs to another branch"

      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.skip != 'true'
        with:
          name: debs
          path: dist/*.deb
          retention-days: 14

      - name: Write the summary comment
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_RESULT: failure
        run: python3 .github/scripts/pr-summary.py

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        if: needs.build.outputs.skip != 'true'
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: needs.build.outputs.skip != 'true'
        with:
          name: debs
          path: dist

      - name: Pick the deb cache key
        id: debs
        if: needs.build.outputs.skip != 'true'
        run: echo "key=verify-debs-$ImageOS-$ImageVersion-" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        if: needs.build.outputs.skip != 'true'
        with:
          path: ~/verify-debs
          key: ${{ steps.debs.outputs.key }}${{ github.run_id }}
          restore-keys: ${{ steps.debs.outputs.key }}

      - name: Install Thunar and the test tools
        id: install
        if: needs.build.outputs.skip != 'true'
        run: .github/scripts/verify-proof.sh install >> "$GITHUB_OUTPUT"

      - uses: actions/cache/save@v4
        if: steps.install.outputs.cached == 'false'
        with:
          path: ~/verify-debs
          key: ${{ steps.debs.outputs.key }}${{ github.run_id }}

      - name: Smoke test and verify/*.sh
        id: run
        if: needs.build.outputs.skip != 'true'
        timeout-minutes: 20
        run: .github/scripts/verify-proof.sh run

      - name: Upload the screenshots and write the verify comment
        if: ${{ !cancelled() && needs.build.outputs.skip != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/verify-proof.sh publish

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && needs.build.outputs.skip != 'true' }}
        with:
          name: verify
          path: |
            ${{ runner.temp }}/verify-proof/results.tsv
            ${{ runner.temp }}/verify-proof/verify.tsv
            ${{ runner.temp }}/verify-proof/numbered.json
            ${{ runner.temp }}/verify-proof/logs/
            ${{ runner.temp }}/verify-proof/shots/
            ${{ runner.temp }}/verify-proof/pairs/
          if-no-files-found: ignore
          retention-days: 14

  explainer:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: explainer-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an explainer
        id: require
        run: .github/scripts/explainer-proof.sh check

      - name: Check the narration
        id: narration
        run: .github/scripts/explainer-proof.sh narration

      - name: Render the explainer
        if: ${{ !cancelled() && steps.require.outcome == 'success' }}
        run: .github/scripts/explainer-proof.sh render

      - name: Upload the image and write the explainer comment
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK: ${{ steps.require.outcome }}
          NARRATION: ${{ steps.narration.outcome }}
        run: .github/scripts/explainer-proof.sh publish

  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: review-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      superseded: ${{ steps.plan.outputs.superseded }}
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_NUMBER: ${{ github.run_number }}
      REVIEW_LEVEL: high
      REVIEW_MODEL: claude-opus-5-5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the review
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export OUT=$RUNNER_TEMP/review
          .github/scripts/review-proof.sh plan >> "$GITHUB_OUTPUT"
          {
            echo 'prompt<<PROMPT_EOF'; cat "$OUT/prompt.md"; echo 'PROMPT_EOF'
            echo "schema=$(cat "$OUT/schema.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Review
        id: review
        if: steps.plan.outputs.skip == '0'
        timeout-minutes: 30
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.plan.outputs.prompt }}
          claude_args: >-
            --model ${{ env.REVIEW_MODEL }}
            --add-dir ${{ runner.temp }}/review
            --allowedTools "Skill,ReportFindings,Read,Grep,Glob,Agent,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git status:*)${{ steps.plan.outputs.mode == 'auto-fix' && ',Edit,Write,MultiEdit' || '' }}"
            --json-schema '${{ steps.plan.outputs.schema }}'

      - name: Collect the findings and the fix
        if: steps.plan.outputs.skip == '0'
        env:
          FINDINGS: ${{ steps.review.outputs.structured_output }}
        run: .github/scripts/review-proof.sh collect

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review
          path: |
            ${{ runner.temp }}/review/plan.json
            ${{ runner.temp }}/review/findings.json
            ${{ runner.temp }}/review/fix.patch
            ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  review-report:
    needs: review
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.review.result != 'cancelled' && needs.review.result != 'skipped' && needs.review.outputs.superseded != '1'
    runs-on: ubuntu-24.04
    concurrency:
      group: review-report-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REVIEW_RESULT: ${{ needs.review.result }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.REVIEW_PUSH_TOKEN }}

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: review
          path: ${{ runner.temp }}/review-in

      - name: Push the fix, post suggestions and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cp .github/scripts/review-proof.sh .github/scripts/review-state.py .github/scripts/pr-comment.sh .github/scripts/pr-summary.py "$RUNNER_TEMP/bin/"
          export IN=$RUNNER_TEMP/review-in
          [[ -f $IN/review/plan.json ]] && IN=$IN/review
          "$RUNNER_TEMP/bin/review-proof.sh" report

  summary:
    needs: [build, verify, explainer, review-report]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Write the summary comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pr-summary.py

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: debs
          path: dist

      - name: Publish release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: .github/scripts/publish-release.sh

      - name: Keep the last 10 releases
        run: .github/scripts/prune-releases.sh
