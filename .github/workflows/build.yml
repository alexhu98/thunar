name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'push' && format('release-{0}', github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Add Zorin OS PPA (Xfce 4.20 libraries)
        run: sudo add-apt-repository -y ppa:zorinos/stable

      - name: Install build dependencies
        run: sudo apt-get build-dep -y ./

      - name: Dry-run the publish scripts
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export VERSION DRY_RUN=1
          VERSION=$(.github/scripts/next-version.sh)
          echo "Version: $VERSION"
          .github/scripts/publish-release.sh
          .github/scripts/prune-releases.sh

      - name: Stamp version
        id: version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(.github/scripts/next-version.sh)
          {
            echo "thunar ($version) noble; urgency=medium"
            echo
            echo "  * CI build of ${GITHUB_SHA::12}."
            echo
            echo " -- GitHub Actions <actions@github.com>  $(date -R)"
            echo
            cat debian/changelog
          } > debian/changelog.new
          mv debian/changelog.new debian/changelog
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: |
          dpkg-buildpackage -b -us -uc -j"$(nproc)"
          mkdir dist
          mv ../*.deb dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb
          retention-days: 14

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: debs
          path: dist

      - name: Pick the deb cache key
        id: debs
        run: echo "key=verify-debs-$ImageOS-$ImageVersion-" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ~/verify-debs
          key: ${{ steps.debs.outputs.key }}${{ github.run_id }}
          restore-keys: ${{ steps.debs.outputs.key }}

      - name: Install Thunar and the test tools
        id: install
        run: .github/scripts/verify-proof.sh install >> "$GITHUB_OUTPUT"

      - uses: actions/cache/save@v4
        if: steps.install.outputs.cached == 'false'
        with:
          path: ~/verify-debs
          key: ${{ steps.debs.outputs.key }}${{ github.run_id }}

      - name: Smoke test and verify/*.sh
        id: run
        timeout-minutes: 20
        run: .github/scripts/verify-proof.sh run

      - name: Upload the screenshots and update the PR comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/verify-proof.sh publish

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: verify
          path: |
            ${{ runner.temp }}/verify-proof/results.tsv
            ${{ runner.temp }}/verify-proof/verify.tsv
            ${{ runner.temp }}/verify-proof/logs/
            ${{ runner.temp }}/verify-proof/shots/
          if-no-files-found: ignore
          retention-days: 14

  explainer:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: explainer-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an explainer
        id: require
        run: .github/scripts/explainer-proof.sh check

      - name: Check the narration
        run: .github/scripts/explainer-proof.sh narration

      - name: Render the explainer
        id: render
        if: ${{ !cancelled() && steps.require.outcome == 'success' }}
        run: .github/scripts/explainer-proof.sh render

      - name: Upload the image and update the PR comment
        if: ${{ !cancelled() && steps.require.outcome == 'success' && steps.render.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/explainer-proof.sh publish

  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: review-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_NUMBER: ${{ github.run_number }}
      REVIEW_LEVEL: xhigh
      REVIEW_MODEL: claude-opus-5-5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the review
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export OUT=$RUNNER_TEMP/review
          .github/scripts/review-proof.sh plan >> "$GITHUB_OUTPUT"
          {
            echo 'prompt<<PROMPT_EOF'; cat "$OUT/prompt.md"; echo 'PROMPT_EOF'
            echo "schema=$(cat "$OUT/schema.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Review
        id: review
        if: steps.plan.outputs.skip == '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.plan.outputs.prompt }}
          claude_args: >-
            --model ${{ env.REVIEW_MODEL }}
            --add-dir ${{ runner.temp }}/review
            --allowedTools "Skill,ReportFindings,Read,Grep,Glob,Agent,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git status:*)${{ steps.plan.outputs.mode == 'auto-fix' && ',Edit,Write,MultiEdit' || '' }}"
            --json-schema '${{ steps.plan.outputs.schema }}'

      - name: Collect the findings and the fix
        if: steps.plan.outputs.skip == '0'
        env:
          FINDINGS: ${{ steps.review.outputs.structured_output }}
        run: .github/scripts/review-proof.sh collect

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review
          path: |
            ${{ runner.temp }}/review/plan.json
            ${{ runner.temp }}/review/findings.json
            ${{ runner.temp }}/review/fix.patch
            ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  review-report:
    needs: review
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.review.result != 'cancelled' && needs.review.result != 'skipped'
    runs-on: ubuntu-24.04
    concurrency:
      group: review-report-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REVIEW_RESULT: ${{ needs.review.result }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.REVIEW_PUSH_TOKEN }}

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: review
          path: ${{ runner.temp }}/review-in

      - name: Push the fix, post suggestions and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cp .github/scripts/review-proof.sh .github/scripts/review-state.py .github/scripts/pr-comment.sh "$RUNNER_TEMP/bin/"
          export IN=$RUNNER_TEMP/review-in
          [[ -f $IN/review/plan.json ]] && IN=$IN/review
          "$RUNNER_TEMP/bin/review-proof.sh" report

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: debs
          path: dist

      - name: Publish release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: .github/scripts/publish-release.sh

      - name: Keep the last 10 releases
        run: .github/scripts/prune-releases.sh
